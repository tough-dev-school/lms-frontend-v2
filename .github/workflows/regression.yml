name: Regression tests
on: [push]

jobs:
  regression:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        color-scheme: [light, dark]

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          cache: true
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/frontend

      - name: Install playwright browsers
        run: pnpm playwright install chromium
        working-directory: apps/frontend

      # A built Storybook serves bundled files, the dev server compiles every module on first load
      - name: Build storybook
        run: pnpm run storybook:build --quiet
        working-directory: apps/frontend

      - name: Serve storybook
        run: |
          pnpm run storybook:serve &
          timeout 30 bash -c 'until curl -sf http://localhost:3001/iframe.html > /dev/null; do sleep 1; done'
        working-directory: apps/frontend

      - name: Run ${{ matrix.color-scheme }} mode visual regression tests
        run: COLOR_SCHEME=${{ matrix.color-scheme }} pnpm run test:regression --run
        working-directory: apps/frontend

      - name: Saving diffs 📥
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff-${{ matrix.color-scheme }}
          path: apps/frontend/tests/__image_snapshots__/__diff_output__
          retention-days: 14

      - name: Saving failure 📥
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received-${{ matrix.color-scheme }}
          path: apps/frontend/tests/__image_snapshots__/__received_output__
          retention-days: 14
