name: Update regression tests snapshots
on: workflow_dispatch

jobs:
  regression:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          cache: true
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/frontend

      - name: Install playwright browsers
        run: pnpm playwright install chromium
        working-directory: apps/frontend

      - name: Build storybook
        run: pnpm run storybook:build --quiet
        working-directory: apps/frontend

      - name: Serve storybook
        run: |
          pnpm run storybook:serve &
          timeout 30 bash -c 'until curl -sf http://localhost:3001/iframe.html > /dev/null; do sleep 1; done'
        working-directory: apps/frontend

      - name: Run regression tests
        run: pnpm run test:regression:update --run
        working-directory: apps/frontend

      - name: Saving screenshots 📥
        uses: actions/upload-artifact@v4
        with:
          name: updated-screenshots
          path: apps/frontend/tests/__image_snapshots__/
          retention-days: 14