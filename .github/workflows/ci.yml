name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    # Branches of this repo already run on push, so pull_request only covers forks
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          cache: true
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter 👀
        run: pnpm run test:lint

      - name: Run typecheck ✅
        run: pnpm run test:types

      - name: Run unit tests 🧪
        run: pnpm run test:unit

      - name: Build 😎
        run: pnpm --filter frontend run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/frontend/dist

  regression:
    runs-on: ubuntu-24.04
    # Branches of this repo already run on push, so pull_request only covers forks
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          cache: true
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/frontend

      - name: Install playwright browsers
        run: pnpm playwright install chromium
        working-directory: apps/frontend

      # A built Storybook serves bundled files, the dev server compiles every module on first load
      - name: Build storybook
        run: pnpm run storybook:build --quiet
        working-directory: apps/frontend

      - name: Serve storybook
        run: |
          pnpm run storybook:serve &
          timeout 30 bash -c 'until curl -sf http://localhost:3001/iframe.html > /dev/null; do sleep 1; done'
        working-directory: apps/frontend

      - name: Run visual regression tests 📸
        run: pnpm run test:regression --run
        working-directory: apps/frontend

      - name: Saving diffs 📥
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff
          path: apps/frontend/tests/__image_snapshots__/__diff_output__
          retention-days: 14

      - name: Saving failure 📥
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received
          path: apps/frontend/tests/__image_snapshots__/__received_output__
          retention-days: 14

  build-docker-image:
    needs: [check, regression]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: apps/frontend/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read image identifiers
        id: image
        uses: ASzc/change-string-case-action@v1
        with:
          string: ${{ github.repository }}

      - name: Build image
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: ./apps/frontend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.lowercase }}:latest
            ghcr.io/${{ steps.image.outputs.lowercase }}:${{ github.sha }}
          build-args: |
            - RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Read image identifiers
        id: image
        uses: ASzc/change-string-case-action@v1
        with:
          string: ${{ github.repository }}

      - name: Update production image
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: circle
          key: ${{ secrets.DEPLOY_KEY }}
          script: docker service update app_lms --image ghcr.io/${{ steps.image.outputs.lowercase }}:${{ github.sha }} --with-registry-auth
